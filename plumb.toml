[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The publishable boundary contract and the runner that executes against it."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = ".runseal"
note = "Committed inert Runseal resources."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Rust workspace anchors."

[[layout.file]]
name = ["ARCHITECTURE.md"]
note = "The architecture document derived and affirmed beside the implementation."

[release]
product = "ironbed"
authority = "https://releases.ironbed.perish.uk"
binaries = ["ironbed"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[release.cargo]
registry = "perish"
packages = ["ironbed-proto"]

