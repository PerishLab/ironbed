[workspace]
resolver = "3"
members = ["crates/proto", "crates/runner"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://git.perish.top/PerishLab/ironbed"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
plumb = { version = "0", registry = "perish" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
